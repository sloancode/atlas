# Local PostgreSQL for development. Credentials are local-only defaults.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_local
      POSTGRES_DB: atlas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
volumes:
  atlas_pg:
